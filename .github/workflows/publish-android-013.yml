name: Publish Android 0.1.3 test download
on:
  push:
    branches: [publish/android-v0.1.3-test.4]
    paths: ['.github/workflows/publish-android-013.yml']
permissions:
  contents: write
concurrency: publish-android-v0.1.3-test.4
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: kcmrshll9-ux/miles-by-kc-downloads
      TAG: v0.1.3-test.4
      APK: Miles-by-KC-0.1.3-Android-test.apk
      ZIP_SHA: 4ce88af319c1d307eeba5283261148cd6fdc5339a1fcdefe97a04e3d905fb59f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Receive the artifact location privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP"
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 -subj '/CN=Miles by KC Android test transfer' -keyout recipient.key -out recipient.pem 2>/dev/null
          # Only this job has the private decryption key. The temporary transfer
          # branch carries a public certificate and an encrypted one-file URL.
          jq -n --arg branch "$GITHUB_REF_NAME" --arg data "$(base64 -w0 recipient.pem)" '{branch:$branch,message:"Prepare the Android release transfer",content:$data}' |
            gh api -X PUT "repos/$REPO/contents/transfer/recipient-$GITHUB_RUN_ID.pem" --input - --silent
          for attempt in $(seq 1 90); do
            if gh api "repos/$REPO/contents/transfer/artifact-$GITHUB_RUN_ID.cms?ref=$GITHUB_REF_NAME" --jq .content > encrypted.b64 2>/dev/null; then
              base64 -d encrypted.b64 > envelope.pem
              openssl cms -decrypt -binary -inform PEM -in envelope.pem -recip recipient.pem -inkey recipient.key -out artifact-url
              exit 0
            fi
            sleep 5
          done
          echo 'The release input was not received in time.'
          exit 1
      - name: Verify the original Android artifact and its signing information
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import os, shutil, subprocess, zipfile
          url = Path("artifact-url").read_text().strip()
          endpoint = urlsplit(url)
          if endpoint.scheme != "https" or not endpoint.hostname or not endpoint.hostname.endswith(".oaiusercontent.com") or endpoint.username or endpoint.password:
              raise SystemExit("Unexpected artifact endpoint")
          # Curl receives the one-file URL on stdin; the runner logs only a status.
          result = subprocess.run(["curl", "--fail", "--silent", "--proto", "=https", "--max-time", "120", "--output", "build.zip", "--config", "-"], input='url = "' + url.replace('\\', '\\\\').replace('"', '\\"') + '"\n', text=True)
          if result.returncode:
              raise SystemExit("Could not download the approved artifact")
          import hashlib
          with open("build.zip","rb") as f:
              if hashlib.file_digest(f,"sha256").hexdigest() != os.environ["ZIP_SHA"]:
                  raise SystemExit("Artifact digest mismatch")
          with zipfile.ZipFile("build.zip") as bundle:
              files = bundle.infolist()
              if len(files) != 1 or files[0].filename != "miles-by-kc-test.apk" or not 0 < files[0].file_size < 250_000_000:
                  raise SystemExit("Unexpected artifact contents")
              with bundle.open(files[0]) as src, open(os.environ["APK"],"xb") as dst:
                  shutil.copyfileobj(src,dst)
          PY
          buildtools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$buildtools/apksigner" verify --print-certs "$APK"
          "$buildtools/aapt" dump badging "$APK" > badging.txt
          head -1 badging.txt | grep -F "name='com.kcmrshll9.milesbykc.dev' versionCode='4' versionName='0.1.3'"
          sha256sum "$APK" > "${APK%.apk}.sha256"
      - name: Publish and download the installer without credentials
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release create "$TAG" "$APK" "${APK%.apk}.sha256" --repo "$REPO" --target '4807b6f34d5333524b6b20b8e2244a51019334fe' --prerelease --title "Miles by KC 0.1.3 · Android GPS fix" --notes-file "$GITHUB_WORKSPACE/release-0.1.3.md"
          curl -qfsSL --retry 4 --retry-all-errors "https://github.com/$REPO/releases/download/$TAG/$APK" -o public.apk
          cmp "$APK" public.apk
          sha256sum public.apk
