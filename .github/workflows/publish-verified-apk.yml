name: Publish verified Android test APK
on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Fresh signed URL for the approved APK-only artifact (masked by publisher)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-v0.1.2-test.3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test publication guards without network access
        run: python3 -m unittest discover -s tests -v
      - name: Verify and publish the approved public APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 publish_release.py
